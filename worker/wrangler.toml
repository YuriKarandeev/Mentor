name = "nastavnik-deepseek-proxy"
main = "deepseek-proxy.js"
compatibility_date = "2025-06-01"
# Preview URL не нужны: клиент ходит только на продовый адрес, а лишние
# публичные адреса — только риск. Отключаем и предупреждение при деплое.
preview_urls = false

# Секреты задаются командами:
#   npx wrangler secret put DEEPSEEK_API_KEY
#   npx wrangler secret put APP_TOKEN
# Для локальной отладки (npx wrangler dev) создайте файл .dev.vars:
#   DEEPSEEK_API_KEY=sk-...
#   APP_TOKEN=...

[vars]
# Список разрешённых origin через запятую (схема + хост, БЕЗ пути).
# Пусто = разрешены любые origin (защита только по APP_TOKEN).
# Прод: GitHub Pages, локальная разработка: Vite dev-сервер.
ALLOWED_ORIGINS = "https://yurikarandeev.github.io,http://localhost:5173"

# --- Напоминания (Web Push) -------------------------------------------------
# Нужны три секрета (значения печатает `npm run vapid:keys` в корне репозитория):
#   npx.cmd -y wrangler@latest secret put VAPID_PUBLIC_KEY
#   npx.cmd -y wrangler@latest secret put VAPID_PRIVATE_KEY
#   npx.cmd -y wrangler@latest secret put VAPID_SUBJECT   # mailto:you@example.com
#
# И KV-хранилище для подписок и расписаний:
#   npx.cmd -y wrangler@latest kv namespace create PUSH_KV
# Затем раскомментируйте блок ниже и вставьте id из вывода команды.
# Пока KV нет, напоминания отвечают 503, а всё остальное работает как раньше.
#
# [[kv_namespaces]]
# binding = "PUSH_KV"
# id = "<id из вывода wrangler kv namespace create PUSH_KV>"

# Cron раз в минуту: рассылка созревших напоминаний. Без PUSH_KV и VAPID-ключей
# обработчик сразу выходит — на остальные функции это не влияет.
[triggers]
crons = ["* * * * *"]

[observability]
enabled = true

# Метаданные версии: /health отдаёт id версии, чтобы без `wrangler tail`
# проверить, что на проде именно свежий деплой (id = `Current Version ID`
# из вывода `wrangler deploy`).
[version_metadata]
binding = "CF_VERSION_METADATA"
