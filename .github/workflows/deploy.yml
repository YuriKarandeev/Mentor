name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Обход бага npm с платформенными optional-зависимостями (npm/cli#4828):
      # Vite 8 работает на rolldown, которому нужен нативный бинарник под Linux.
      # Если в package-lock.json его нет, доставляем явно — иначе падают и check, и build.
      - name: Ensure native rolldown binding
        run: |
          VER=$(node -p "require('rolldown/package.json').version")
          if [ ! -d "node_modules/@rolldown/binding-linux-x64-gnu" ]; then
            echo "Ставлю @rolldown/binding-linux-x64-gnu@$VER"
            npm install --no-save --no-package-lock "@rolldown/binding-linux-x64-gnu@$VER"
          else
            echo "Биндинг уже установлен ($VER)"
          fi

      - name: Type check
        run: npm run check

      - name: Sync unit tests
        run: npm run test:sync

      - name: Stream error tests
        run: npm run test:stream

      - name: Connection mode tests
        run: npm run test:conn

      - name: Generate PWA icons
        run: npm run icons

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Переменные репозитория (Settings → Secrets and variables → Actions → Variables).
          # Пустые значения — приложение берёт значения по умолчанию из src/lib/sync/config.ts.
          VITE_SYNC_ENABLED: ${{ vars.VITE_SYNC_ENABLED }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_SENDER_ID: ${{ vars.VITE_FIREBASE_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}

      - name: Smoke test dist
        run: npm run smoke

      - name: Add .nojekyll
        run: node -e "require('fs').writeFileSync('dist/.nojekyll','')"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
